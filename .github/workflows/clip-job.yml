name: Clip job

on:
  repository_dispatch:
    types: [clip-request]
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube stream/video link"
        required: true
        type: string
      mode:
        description: "auto = AI picks the top moments, manual = your time range"
        required: false
        default: "auto"
        type: choice
        options: [auto, manual]
      start:
        description: "Window start (HH:MM:SS)"
        required: false
        default: "00:00:00"
        type: string
      seconds:
        description: "Manual mode: clip length in seconds"
        required: false
        default: "60"
        type: string
      count:
        description: "Auto mode: how many clips"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (YouTube needs a JS runtime for yt-dlp)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install yt-dlp
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run clip job
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          JOB_URL: ${{ github.event.client_payload.url || inputs.url }}
          JOB_ID: ${{ github.event.client_payload.job_id || format('manual-{0}', github.run_id) }}
          JOB_START: ${{ github.event.client_payload.start || inputs.start }}
          JOB_SECONDS: ${{ github.event.client_payload.seconds || inputs.seconds }}
          JOB_COUNT: ${{ github.event.client_payload.count || inputs.count }}
          JOB_MODE: ${{ github.event.client_payload.mode || inputs.mode }}
        run: |
          python scripts/clip_job.py \
            --url "$JOB_URL" \
            --job-id "$JOB_ID" \
            --start "$JOB_START" \
            --seconds "$JOB_SECONDS" \
            --count "$JOB_COUNT" \
            --mode "$JOB_MODE"
        continue-on-error: true

      - name: Commit job result
        run: |
          git config user.name "gta-clipper bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs out
          git commit -m "clip job ${{ github.event.client_payload.job_id || github.run_id }}" || echo "nothing to commit"
          git push
